name: Build Robot Sorter

on:
  workflow_dispatch:
  push:
    tags:
      - "robot-sorter-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RobotSorter-Windows
          - os: macos-14
            artifact: RobotSorter-macOS
          - os: ubuntu-22.04
            artifact: RobotSorter-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -r robotics/ml/requirements-build.txt
      - name: Run sorter tests
        run: python -m unittest discover -s robotics/ml/tests -v
      - name: Build native application
        run: pyinstaller --clean --noconfirm robotics/ml/robot-sorter.spec
      - name: Add launchers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item scripts/start-robot-sorter-execute.bat dist/
      - name: Add launchers (macOS/Linux)
        if: runner.os != 'Windows'
        run: cp scripts/start-robot-sorter-execute.* dist/ && chmod +x dist/start-robot-sorter-execute.*
      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath RobotSorter-Windows.zip
      - name: Package release (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar -czf "RobotSorter-${{ runner.os }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: RobotSorter-*
      - name: Attach tagged builds to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RobotSorter-*
