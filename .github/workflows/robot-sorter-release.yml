name: Build Robot Sorter

on:
  workflow_dispatch:
  push:
    tags:
      - "robot-sorter-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RobotSorter-Windows
            package: RobotSorter-Windows
          - os: macos-15
            artifact: RobotSorter-macOS-Apple-Silicon
            package: RobotSorter-macOS-Apple-Silicon
          - os: macos-15-intel
            artifact: RobotSorter-macOS-Intel
            package: RobotSorter-macOS-Intel
          - os: ubuntu-22.04
            artifact: RobotSorter-Linux
            package: RobotSorter-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -r robotics/ml/requirements-build.txt
      - name: Run sorter tests
        run: python -m unittest discover -s robotics/ml/tests -v
      - name: Build native application
        run: pyinstaller --clean --noconfirm robotics/ml/robot-sorter.spec
      - name: Add launchers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item scripts/start-robot-sorter-execute.bat dist/
      - name: Add launchers (macOS/Linux)
        if: runner.os != 'Windows'
        run: cp scripts/start-robot-sorter-execute.* dist/ && chmod +x dist/start-robot-sorter-execute.*
      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.package }}.zip
      - name: Package release (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.package }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: sha256sum release-assets/RobotSorter-* > release-assets/SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Robot Sorter ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
